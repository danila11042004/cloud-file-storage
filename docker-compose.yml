services:
  postgres:
    image: postgres:18
    container_name: cloud-storage-postgres
    environment:
      POSTGRES_DB: cloud_storage
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
  redis:
    image: redis:8
    container_name: cloud-storage-redis
    ports:
      - "6379:6379"
  minio:
    image: minio/minio
    container_name: cloud-storage-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
  frontend:
    build:
      context: ./frontend
    container_name: cloud-storage-frontend
    ports:
      - "3000:80"
volumes:
  postgres-data:
  minio-data: