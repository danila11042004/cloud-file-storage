spring.application.name=cloud-file-storage
spring.datasource.url=jdbc:postgresql://localhost:5432/cloud_storage
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.timeout=30m
minio.url=http://localhost:9000
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}
minio.bucket-name=user-files
logging.file.name=logs/cloud-file-storage.log
springdoc.override-with-generic-response=false